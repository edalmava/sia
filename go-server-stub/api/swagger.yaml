  description: SwaggerHub API Auto Mocking
tags:
- name: Instituciones
  description: Operaciones con instituciones educativas
- name: Sedes
  description: Gestión de sedes por institución
- name: Grados
  description: Gestión de grados académicos
- name: Grupos
  description: Gestión de grupos por grado
- name: Jornadas
  description: Gestión de jornadas escolares
- name: Asignaturas
  description: Gestión de asignaturas académicas
- name: Estudiantes
  description: Administración de estudiantes
- name: Docentes
  description: Gestión de docentes
- name: Carga Académica
  description: Gestión de cargas académicas para docentes
- name: Matricula
  description: Gestión de matrículas de estudiantes
- name: Evaluaciones
  description: Operaciones relacionadas con evaluaciones académicas
- name: Calificaciones
  description: Gestión de calificaciones de estudiantes
- name: Asistencia
  description: Control de asistencia de estudiantes
- name: Observaciones
  description: Registro de observaciones de comportamiento
- name: Usuarios
  description: Gestión de usuarios del sistema
- name: Periodos
  description: Gestión de periodos académicos
- name: Año Lectivo
  description: Gestión de años lectivos
- name: Acudientes
  description: Gestión de acudientes de estudiantes
- name: Competencias
  description: Gestión de competencias académicas
- name: Logros
  description: Gestión de logros académicos
- name: Horarios
  description: Gestión de horarios escolares
paths:
  /instituciones:
    get:
      tags:
      - Instituciones
      summary: Obtener todas las instituciones
      parameters:
      - name: offset
        in: query
        description: Número de registros a omitir para paginación
        required: false
        style: form
        explode: true
        schema:
          minimum: 0
          type: integer
          default: 0
      - name: limit
        in: query
        description: Número máximo de registros a devolver
        required: false
        style: form
        explode: true
        schema:
          maximum: 100
          minimum: 1
          type: integer
          default: 20
      - name: sort
        in: query
        description: |
          Campo(s) por los cuales ordenar los resultados. Separar múltiples campos por comas. Prefijar con '-' para orden descendente (ej: "nombre,-fecha_creacion"). Los campos disponibles dependen del recurso solicitado.
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: "nombre,-fecha_registro"
      - name: nombre
        in: query
        description: Filtrar por nombre
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        "200":
          description: Lista de instituciones
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_200"
        "401":
          description: No autorizado
        "403":
          description: Prohibido
    post:
      tags:
      - Instituciones
      summary: Crear nueva institución
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Institucion"
        required: true
      responses:
        "201":
          description: Institución creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Institucion"
        "400":
          description: Error de validación
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autorizado
        "403":
          description: Prohibido
      security:
      - bearerAuth: []
