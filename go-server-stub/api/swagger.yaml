components:
  schemas:
    Institucion:
      required:
      - codigo_dane
      - nombre
      type: object
      properties:
        id_institucion:
          type: integer
          readOnly: true
          example: 1
        nombre:
          maxLength: 100
          minLength: 5
          pattern: "^[A-Za-zÁÉÍÓÚáéíóúñÑ ]+$"
          type: string
          example: Institución Educativa Distrital Kennedy
        codigo_dane:
          pattern: "^[0-9]{12}$"
          type: string
          example: "111001107836"
      example:
        id_institucion: 1
        nombre: Institución Educativa Distrital Kennedy
        codigo_dane: "111001107836"
    Sede:
      required:
      - id_institucion
      - nombre
      type: object
      properties:
        id_sede:
          type: integer
          readOnly: true
          example: 1
        nombre:
          maxLength: 100
          type: string
          example: Sede Principal
        direccion:
          maxLength: 150
          type: string
          example: "Calle 5 #10-25, Kennedy"
        id_institucion:
          type: integer
          example: 1
        id_municipio:
          type: integer
          example: 1
      example:
        id_institucion: 1
        id_sede: 1
        id_municipio: 1
        direccion: "Calle 5 #10-25, Kennedy"
        nombre: Sede Principal
    Grado:
      required:
      - nombre
      type: object
      properties:
        id_grado:
          type: integer
          readOnly: true
          example: 1
        nombre:
          maxLength: 20
          type: string
          example: Sexto
      example:
        id_grado: 1
        nombre: Sexto
    Grupo:
      required:
      - id_grado
      - id_jornada
      - id_sede
      - nombre
      type: object
      properties:
        id_grupo:
          type: integer
          readOnly: true
          example: 1
        nombre:
          maxLength: 10
          type: string
          example: 6A
        id_grado:
          type: integer
          example: 1
        id_sede:
          type: integer
          example: 1
        id_jornada:
          type: integer
          example: 1
      example:
        id_grupo: 1
        id_sede: 1
        id_grado: 1
        id_jornada: 1
        nombre: 6A
    Jornada:
      required:
      - nombre
      type: object
      properties:
        id_jornada:
          type: integer
          readOnly: true
          example: 1
        nombre:
          maxLength: 50
          type: string
          example: Mañana
      example:
        id_jornada: 1
        nombre: Mañana
    Asignatura:
      required:
      - nombre
      type: object
      properties:
        id_asignatura:
          type: integer
          readOnly: true
          example: 1
        nombre:
          maxLength: 100
          type: string
          example: Matemáticas
        intensidad_horaria:
          type: integer
          example: 5
      example:
        intensidad_horaria: 5
        id_asignatura: 1
        nombre: Matemáticas
    GradoAsignatura:
      required:
      - id_asignatura
      - id_grado
      type: object
      properties:
        id_grado:
          type: integer
          example: 1
        id_asignatura:
          type: integer
          example: 1
      example:
        id_asignatura: 1
        id_grado: 1
    Estudiante:
      required:
      - apellidos
      - documento_identidad
      - nombres
      - tipo_documento
      type: object
      properties:
        documento_identidad:
          pattern: "^[0-9]{8,10}$"
          type: string
          example: "1023456789"
        tipo_documento:
          type: string
          example: TI
          enum:
          - CC
          - TI
          - RC
          - CE
          - PA
        fecha_nacimiento:
          type: string
          description: Debe ser una fecha pasada
          format: date
          example: 2010-05-15
        telefono:
          pattern: "^\\+?[0-9]{7,15}$"
          type: string
          example: "+573101234567"
        correo_electronico:
          maxLength: 100
          type: string
          format: email
          example: juan.perez@ejemplo.com
        id_estudiante:
          type: integer
          readOnly: true
          example: 1
        nombres:
          maxLength: 100
          type: string
          example: Juan Carlos
        apellidos:
          maxLength: 100
          type: string
          example: Pérez Rodríguez
        direccion:
          maxLength: 150
          type: string
          example: "Calle 10 #15-30"
        id_municipio:
          type: integer
          example: 1
      example:
        apellidos: Pérez Rodríguez
        documento_identidad: "1023456789"
        tipo_documento: TI
        correo_electronico: juan.perez@ejemplo.com
        id_estudiante: 1
        id_municipio: 1
        fecha_nacimiento: 2010-05-15T00:00:00.000+00:00
        direccion: "Calle 10 #15-30"
        telefono: "+573101234567"
        nombres: Juan Carlos
    Docente:
      required:
      - apellidos
      - documento_identidad
      - nombres
      - tipo_documento
      type: object
      properties:
        id_docente:
          type: integer
          readOnly: true
          example: 1
        nombres:
          maxLength: 100
          type: string
          example: María José
        apellidos:
          maxLength: 100
          type: string
          example: Gómez Sánchez
        documento_identidad:
          maxLength: 20
          type: string
          example: "52123456"
        tipo_documento:
          type: string
          example: CC
          enum:
          - CC
          - TI
          - CE
          - PA
        profesion:
          maxLength: 100
          type: string
          example: Licenciado en Matemáticas
        telefono:
          maxLength: 20
          type: string
          example: "3157891234"
        correo_electronico:
          maxLength: 100
          type: string
          example: maria.gomez@ejemplo.com
      example:
        apellidos: Gómez Sánchez
        documento_identidad: "52123456"
        tipo_documento: CC
        correo_electronico: maria.gomez@ejemplo.com
        id_docente: 1
        profesion: Licenciado en Matemáticas
        telefono: "3157891234"
        nombres: María José
    CargaAcademica:
      required:
      - id_anio_lectivo
      - id_asignatura
      - id_docente
      - id_grupo
      type: object
      properties:
        id_carga:
          type: integer
          readOnly: true
          example: 1
        id_docente:
          type: integer
          example: 1
        id_grupo:
          type: integer
          example: 1
        id_asignatura:
          type: integer
          example: 1
        id_anio_lectivo:
          type: integer
          example: 1
      example:
        id_grupo: 1
        id_anio_lectivo: 1
        id_asignatura: 1
        id_docente: 1
        id_carga: 1
    Periodo:
      required:
      - fecha_fin
      - fecha_inicio
      - id_anio_lectivo
      - nombre
      type: object
      properties:
        id_periodo:
          type: integer
          readOnly: true
          example: 1
        nombre:
          maxLength: 50
          type: string
          example: Primer Periodo
        fecha_inicio:
          type: string
          format: date
          example: 2025-01-15
        fecha_fin:
          type: string
          format: date
          example: 2025-04-15
        id_anio_lectivo:
          type: integer
          example: 1
      example:
        fecha_inicio: 2025-01-15T00:00:00.000+00:00
        id_anio_lectivo: 1
        fecha_fin: 2025-04-15T00:00:00.000+00:00
        nombre: Primer Periodo
        id_periodo: 1
    AnioLectivo:
      required:
      - anio
      - fecha_fin
      - fecha_inicio
      type: object
      properties:
        id_anio_lectivo:
          type: integer
          readOnly: true
          example: 1
        anio:
          type: integer
          example: 2025
        fecha_inicio:
          type: string
          format: date
          example: 2025-01-15
        fecha_fin:
          type: string
          format: date
          example: 2025-11-30
        estado:
          type: string
          example: ACTIVO
          enum:
          - ACTIVO
          - CERRADO
          - PLANEACION
      example:
        estado: ACTIVO
        fecha_inicio: 2025-01-15T00:00:00.000+00:00
        id_anio_lectivo: 1
        fecha_fin: 2025-11-30T00:00:00.000+00:00
        anio: 2025
