        tipo:
          type: string
          example: ABIERTA
          enum:
          - ABIERTA
          - OPCION_MULTIPLE
          - VERDADERO_FALSO
        peso:
          maximum: 5
          minimum: 0.01
          type: number
          format: float
          example: 1
          default: 1
