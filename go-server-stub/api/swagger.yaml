      properties:
        id_evaluacion:
          type: integer
          readOnly: true
          example: 1
        id_carga_academica:
          type: integer
          example: 1
        id_periodo:
          type: integer
          example: 1
        id_tipo_evaluacion:
          type: integer
          example: 1
        id_logro:
          type: integer
          example: 1
        nombre:
          maxLength: 100
          type: string
