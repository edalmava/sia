  parameters:
    apiVersionHeader:
      name: X-API-Version
      in: header
      description: Versión de la API solicitada
      required: false
      style: simple
      explode: false
      schema:
        type: string
        default: "1.0"
    offsetParam:
      name: offset
      in: query
      description: Número de registros a omitir para paginación
      required: false
      style: form
      explode: true
      schema:
        minimum: 0
        type: integer
        default: 0
    limitParam:
      name: limit
      in: query
      description: Número máximo de registros a devolver
      required: false
      style: form
      explode: true
      schema:
        maximum: 100
        minimum: 1
        type: integer
        default: 20
    sortParam:
      name: sort
      in: query
      description: |
        Campo(s) por los cuales ordenar los resultados. Separar múltiples campos por comas. Prefijar con '-' para orden descendente (ej: "nombre,-fecha_creacion"). Los campos disponibles dependen del recurso solicitado.
      required: false
      style: form
      explode: true
      schema:
        type: string
      example: "nombre,-fecha_registro"
  securitySchemes:
    bearerAuth:
      type: http
      description: |
        JWT obtenido del endpoint de autenticación.
        Ejemplo: Bearer <token>
      scheme: bearer
      bearerFormat: JWT
